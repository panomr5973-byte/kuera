version: "3.8"

services:
  kuera:
    build: .
    image: kuera-ai:3.2.0
    container_name: kuera-ai
    restart: unless-stopped
    ports:
      - "7777:7777"   # Control Panel
      - "8000:8000"   # Canonical API
      - "18789:18789" # WebSocket Gateway
    volumes:
      # Persist data between restarts
      - ./data:/app/data
      - ./logs:/app/logs
      - ./memory:/app/memory
      # Mount model directory (optional — large files)
      # - ./models/llm:/app/models/llm:ro
    environment:
      - PYTHONUNBUFFERED=1
      - KUERA_ENV=docker
      - KUERA_VERSION=3.2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7777/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - kuera-net

  # Optional: Nginx reverse proxy for production
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - kuera
  #   networks:
  #     - kuera-net

networks:
  kuera-net:
    driver: bridge
