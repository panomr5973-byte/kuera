[tool.poetry]
name = "ai-kuera-mirofish"
version = "2.0.0"
description = "Self-evolving multi-agent AI for Indonesia data + Mirofish aquaculture"
authors = ["User <admin@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.11"
numpy = ">=1.24.0"
pandas = ">=2.0.0"
scikit-learn = ">=1.3.0"
torch = ">=2.0.0"
transformers = ">=4.30.0"
fastapi = ">=0.104.0"
uvicorn = [{extras = ["standard"], version = ">=0.24.0"}]
streamlit = ">=1.28.0"
mlflow = ">=2.8.0"
ollama = ">=0.1.0"
alembic = ">=1.13.0"
pydantic = {extras = ["email"], version = ">=2.5.0"}
pytest = ">=8.0.0"
ruff = ">=0.5.0"
black = ">=24.0.0"
mypy = ">=1.10.0"
chromadb = ">=0.5.0" # RAG
python-jose = {version = ">=3.3.0", extras = ["cryptography"]}

[tool.poetry.group.dev.dependencies]
jupyter = ">=1.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

