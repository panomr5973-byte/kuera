<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUERA Nusantara - AI Rakyat Indonesia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #ff6b35;
            --secondary: #f7931e;
            --accent: #00d4aa;
            --bg-gradient: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            --card-bg: rgba(255,255,255,0.1);
            --text-primary: #fff;
            --text-secondary: rgba(255,255,255,0.8);
            --shadow: 0 8px 32px rgba(0,0,0,0.3);
            --border: rgba(255,255,255,0.2);
        }
        
        body {
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 25px;
        }
        
        @media (max-width: 1024px) {
            .container { grid-template-columns: 1fr; }
        }
        
        .header {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        
        .header h1 {
            font-size: clamp(2em, 5vw, 3.5em);
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .stat-item {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--border);
            text-align: center;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: 700;
            color: var(--primary);
        }
        
        .chat-section {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 75vh;
        }
        
        .chat-header {
            padding: 20px 25px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }
        
        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user { text-align: right; }
        
        .message-bubble {
            display: inline-block;
            max-width: 75%;
            padding: 16px 24px;
            border-radius: 22px;
            line-height: 1.6;
            word-break: break-word;
        }
        
        .message.user .message-bubble {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }
        
        .message.assistant .message-bubble {
            background: rgba(255,255,255,0.9);
            color: #333;
        }
        
        .chat-input-area {
            padding: 20px 25px;
            border-top: 1px solid var(--border);
        }
        
        .input-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .upload-btn {
            padding: 16px;
            background: rgba(255,255,255,0.2);
            border: 1px solid var(--border);
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2em;
            transition: all 0.3s;
        }
        
        .upload-btn:hover {
            background: var(--accent);
            transform: scale(1.1);
        }
        
        .chat-input {
            flex: 1;
            padding: 16px 24px;
            background: rgba(255,255,255,0.2);
            border: 1px solid var(--border);
            border-radius: 30px;
            font-size: 1em;
            color: var(--text-primary);
            outline: none;
        }
        
        .chat-input::placeholder { color: var(--text-secondary); }
        
        .send-btn {
            padding: 16px 28px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255,107,53,0.4);
        }
        
        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .typing-indicator {
            display: none;
            padding: 20px;
        }
        
        .typing-indicator.active { display: block; }
        
        .typing-dots {
            display: inline-flex;
            gap: 6px;
        }
        
        .typing-dots span {
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.8); }
            40% { transform: scale(1.2); }
        }
        
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .panel {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 25px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        
        .panel-title {
            color: var(--primary);
            font-size: 1.2em;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .quick-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .quick-btn {
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border);
            border-radius: 15px;
            cursor: pointer;
            color: var(--text-primary);
            transition: all 0.3s;
        }
        
        .quick-btn:hover {
            background: var(--primary);
        }
        
        .file-list {
            max-height: 250px;
            overflow-y: auto;
        }
        
        .file-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            margin-bottom: 8px;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🇮🇩 KUERA Nusantara</h1>
            <p>AI Rakyat Indonesia - Sabang Merauke Jadi Satu</p>
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-value" id="stat-interactions">0</div>
                    <div class="stat-label">Interaksi</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-sessions">0</div>
                    <div class="stat-label">Sessions</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">34</div>
                    <div class="stat-label">Provinsi</div>
                </div>
            </div>
        </div>
        
        <div class="chat-section">
            <div class="chat-header">
                <h3>💬 Chat dengan KUERA</h3>
                <span id="session-id">Session: Loading...</span>
            </div>
            
            <div class="chat-messages" id="chat-messages">
                <div style="text-align: center; padding: 40px; opacity: 0.7;">
                    <h3>🌺 Selamat Datang!</h3>
                    <p>Upload dokumen atau ketik pesan untuk memulai</p>
                </div>
            </div>
            
            <div class="typing-indicator" id="typing-indicator">
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
            
            <div class="chat-input-area">
                <div class="progress-bar" id="upload-progress" style="display: none;">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="input-group">
                    <button class="upload-btn" onclick="document.getElementById('file-input').click()" title="Upload File">
                        📎
                    </button>
                    <input type="file" id="file-input" accept=".txt,.pdf,.docx,.csv,.json,.md" hidden onchange="uploadFile(this.files[0])">
                    <input type="text" class="chat-input" id="chat-input" placeholder="Ketik pesan..." onkeypress="if(event.key==='Enter')sendMessage()">
                    <button class="send-btn" id="send-btn" onclick="sendMessage()">🚀 Kirim</button>
                </div>
            </div>
        </div>
        
        <div class="sidebar">
            <div class="panel">
                <div class="panel-title">⚡ Quick Actions</div>
                <div class="quick-grid">
                    <button class="quick-btn" onclick="quickMessage('Kalimantan')">Kalimantan</button>
                    <button class="quick-btn" onclick="quickMessage('Ekonomi')">Ekonomi</button>
                    <button class="quick-btn" onclick="quickMessage('stats')">Stats</button>
                    <button class="quick-btn" onclick="quickMessage('Indonesia')">Nusantara</button>
                </div>
            </div>
            
            <div class="panel">
                <div class="panel-title">📚 Dokumen</div>
                <div class="file-list" id="file-list">
                    <p style="text-align: center; opacity: 0.6;">Belum ada dokumen</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let sessionId = Math.random().toString(36).substring(2, 10);
        document.getElementById('session-id').textContent = 'Session: ' + sessionId;
        
        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const btn = document.getElementById('send-btn');
            const message = input.value.trim();
            
            if (!message) return;
            
            addMessage('user', message);
            input.value = '';
            input.disabled = true;
            btn.disabled = true;
            showTyping(true);
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: message, session_id: sessionId})
                });
                
                const data = await response.json();
                showTyping(false);
                
                if (data.success) {
                    addMessage('assistant', data.response);
                    sessionId = data.session_id;
                    document.getElementById('session-id').textContent = 'Session: ' + sessionId;
                } else {
                    addMessage('assistant', '❌ Error: ' + data.error);
                }
            } catch (error) {
                showTyping(false);
                addMessage('assistant', '❌ Tidak dapat terhubung ke server');
            }
            
            input.disabled = false;
            btn.disabled = false;
            input.focus();
        }
        
        function addMessage(role, content) {
            const container = document.getElementById('chat-messages');
            const welcome = container.querySelector('[style*="text-align: center"]');
            if (welcome) welcome.remove();
            
            const time = new Date().toLocaleTimeString('id-ID', {hour: '2-digit', minute: '2-digit'});
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.innerHTML = `
                <div class="message-bubble">${escapeHtml(content).replace(/\n/g, '<br>')}</div>
                <div style="font-size: 0.75em; opacity: 0.7; margin-top: 5px;">${time}</div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function showTyping(show) {
            document.getElementById('typing-indicator').classList.toggle('active', show);
        }
        
        function quickMessage(text) {
            document.getElementById('chat-input').value = text;
            sendMessage();
        }
        
        async function uploadFile(file) {
            if (!file) return;
            
            const progressBar = document.getElementById('upload-progress');
            const progressFill = document.getElementById('progress-fill');
            progressBar.style.display = 'block';
            progressFill.style.width = '30%';
            
            const formData = new FormData();
            formData.append('file', file);
            
            addMessage('user', '📎 Upload: ' + file.name);
            showTyping(true);
            
            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                
                progressFill.style.width = '70%';
                const data = await response.json();
                showTyping(false);
                progressFill.style.width = '100%';
                
                if (data.success) {
                    addMessage('assistant', '✅ ' + data.message + '\n\n📝 Ringkasan: ' + data.summary);
                    loadFiles();
                } else {
                    addMessage('assistant', '❌ Error: ' + data.error);
                }
                
                setTimeout(() => {
                    progressBar.style.display = 'none';
                    progressFill.style.width = '0%';
                }, 1000);
                
            } catch (error) {
                showTyping(false);
                progressBar.style.display = 'none';
                addMessage('assistant', '❌ Upload gagal');
            }
            
            document.getElementById('file-input').value = '';
        }
        
        async function loadFiles() {
            try {
                const response = await fetch('/api/files');
                const data = await response.json();
                
                const list = document.getElementById('file-list');
                if (data.files && data.files.length > 0) {
                    list.innerHTML = data.files.map(f => `
                        <div class="file-item">
                            <span>📄</span>
                            <div style="flex: 1; min-width: 0;">
                                <div style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${f.filename}</div>
                                <div style="font-size: 0.8em; opacity: 0.7;">${f.file_type} • ${(f.file_size/1024).toFixed(1)}KB</div>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (e) {
                console.log('Load files error:', e);
            }
        }
        
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                if (data.database) {
                    document.getElementById('stat-interactions').textContent = data.database.total_interactions || 0;
                    document.getElementById('stat-sessions').textContent = data.database.total_sessions || 0;
                }
            } catch (e) {
                console.log('Stats error:', e);
            }
        }
        
        loadFiles();
        loadStats();
        setInterval(loadStats, 5000);
    </script>
</body>
</html>
