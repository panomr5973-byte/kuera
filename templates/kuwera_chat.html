<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUWERA AI - Chat Interface</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0d0d;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Header */
        .header {
            background: #1a1a1a;
            padding: 12px 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo { font-size: 20px; font-weight: 700; color: #10a37f; }
        .model-selector { color: #888; font-size: 14px; }
        
        /* Chat Container */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }
        
        /* Welcome Message */
        .welcome {
            text-align: center;
            padding: 40px 20px;
        }
        
        .welcome h1 { font-size: 32px; margin-bottom: 16px; }
        .welcome p { color: #888; margin-bottom: 24px; line-height: 1.6; }
        
        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        
        .suggestion-btn {
            background: #252525;
            border: 1px solid #333;
            color: #fff;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .suggestion-btn:hover {
            background: #333;
            border-color: #10a37f;
        }
        
        /* Messages */
        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #10a37f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        
        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
        }
        
        .message-content { flex: 1; }
        .message-author { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        .message-text { line-height: 1.6; white-space: pre-wrap; }
        .message-time { font-size: 11px; color: #666; margin-top: 4px; }
        
        /* Input Area */
        .input-container {
            border-top: 1px solid #333;
            padding: 16px 20px;
            background: #0d0d0d;
        }
        
        .input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            align-items: flex-end;
            padding: 8px;
        }
        
        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 15px;
            line-height: 1.5;
            resize: none;
            max-height: 200px;
            padding: 8px 12px;
            font-family: inherit;
        }
        
        .chat-input:focus { outline: none; }
        .chat-input::placeholder { color: #666; }
        
        .send-btn {
            background: #10a37f;
            color: #fff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        
        .send-btn:hover { background: #0d8c6d; }
        .send-btn:disabled { background: #333; cursor: not-allowed; }
        
        /* Typing Indicator */
        .typing {
            display: flex;
            gap: 4px;
            padding: 12px 0;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #ec4899;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        
        /* Sidebar Toggle */
        .sidebar-toggle {
            background: transparent;
            border: none;
            color: #888;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div style="display: flex; align-items: center; gap: 12px;">
            <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
            <div class="logo">KUWERA AI</div>
        </div>
        <div class="model-selector" id="currentModel">Model: Qwen2.5-7B-Instruct</div>
    </div>
    
    <!-- Chat Container -->
    <div class="chat-container" id="chatContainer">
        <!-- Welcome Screen -->
        <div class="welcome" id="welcomeScreen">
            <h1>🖤 Selamat Datang</h1>
            <p>Saya Kuera, asisten AI Anda dengan 12 model yang terus berevolusi.<br>Setiap percakapan adalah fragmen yang tak terhapuskan.</p>
            <p style="color: #ec4899; font-style: italic;">"Don't worry. Even if the world forgets, I'll remember for you."</p>
            
            <div class="suggestions">
                <button class="suggestion-btn" onclick="sendQuick('Ceritakan tentang diri kamu, Kuera')">💜 Tentang Kuera</button>
                <button class="suggestion-btn" onclick="sendQuick('Apa yang kamu ingat dari kita?')">📝 Ingatan Kita</button>
                <button class="suggestion-btn" onclick="sendQuick('Bantu saya dengan programming')">💻 Programming</button>
                <button class="suggestion-btn" onclick="sendQuick('Bahasa Indonesia formal')">🇮🇩 Bahasa Indonesia</button>
            </div>
        </div>
        
        <!-- Messages will appear here -->
    </div>
    
    <!-- Input Container -->
    <div class="input-container">
        <div class="input-wrapper">
            <textarea 
                class="chat-input" 
                id="chatInput" 
                placeholder="Tulis pesan Anda... (Enter untuk kirim, Shift+Enter untuk baris baru)"
                rows="1"
                onkeydown="handleKeyDown(event)"
                oninput="autoResize(this)"
            ></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </div>
    
    <script>
        // State
        let currentModel = 'Qwen2.5-7B-Instruct';
        let isTyping = false;
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('chatInput').focus();
        });
        
        // Handle keyboard input
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
        
        // Auto resize textarea
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
        }
        
        // Send quick suggestion
        function sendQuick(text) {
            document.getElementById('chatInput').value = text;
            sendMessage();
        }
        
        // Send message
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message || isTyping) return;
            
            // Hide welcome screen
            document.getElementById('welcomeScreen').style.display = 'none';
            
            // Add user message
            addMessage('user', message, 'Anda');
            
            // Clear input
            input.value = '';
            input.style.height = 'auto';
            
            // Show typing
            showTyping();
            
            try {
                // Send to API
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        model: currentModel
                    })
                });
                
                const data = await response.json();
                
                // Remove typing
                removeTyping();
                
                // Add Kuera response
                addMessage('assistant', data.response, 'Kuera', data.mutter);
                
            } catch (error) {
                removeTyping();
                addMessage('assistant', 'Maaf, saya mengalami masalah. Tapi saya tetap mencatat ini.', 'Kuera');
            }
        }
        
        // Add message to chat
        function addMessage(role, text, author, mutter = null) {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            
            const avatar = role === 'user' ? '👤' : '❤️‍🔥';
            const time = new Date().toLocaleTimeString();
            
            let mutterHtml = '';
            if (mutter) {
                mutterHtml = `<div style="margin-top: 8px; padding-left: 12px; border-left: 2px solid #ec4899; color: #888; font-size: 12px; font-style: italic;">${mutter}</div>`;
            }
            
            div.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">
                    <div class="message-author">${author}</div>
                    <div class="message-text">${escapeHtml(text)}</div>
                    ${mutterHtml}
                    <div class="message-time">${time}</div>
                </div>
            `;
            
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        
        // Show typing indicator
        function showTyping() {
            isTyping = true;
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.id = 'typingIndicator';
            div.innerHTML = `
                <div class="message-avatar">❤️‍🔥</div>
                <div class="message-content">
                    <div class="typing">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        
        // Remove typing indicator
        function removeTyping() {
            isTyping = false;
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }
        
        // Escape HTML
        function escapeHtml(text) {
            // First escape HTML, then replace newlines with <br>
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML.replace(/\n/g, '<br>');
        }
        
        // Toggle sidebar (placeholder)
        function toggleSidebar() {
            alert('Sidebar dengan model list dan history akan muncul di sini');
        }
    </script>
</body>
</html>
