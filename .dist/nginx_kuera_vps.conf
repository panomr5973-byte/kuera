# KUERA Reverse Proxy Configuration
# Proxies Windows services via Tailscale
# VPS: kuera-vps (100.111.193.44)
# Windows: WORKSTATION-LOCAL (192.168.1.100)

upstream kuera_control {
    server 192.168.1.100:7777;
}

upstream kuera_api {
    server 192.168.1.100:8000;
}

upstream kuera_real_api {
    server 192.168.1.100:8001;
}

upstream kuera_web {
    server 192.168.1.100:5000;
}

upstream kuera_admin {
    server 192.168.1.100:5001;
}

upstream kuera_dashboard {
    server 192.168.1.100:8501;
}

server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/kuera_access.log;
    error_log /var/log/nginx/kuera_error.log;

    # KUERA Control Panel (main)
    location / {
        proxy_pass http://kuera_control;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # API v1
    location /api/ {
        proxy_pass http://kuera_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Real API
    location /real-api/ {
        proxy_pass http://kuera_real_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Web v2
    location /web/ {
        proxy_pass http://kuera_web/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Admin Panel
    location /admin/ {
        proxy_pass http://kuera_admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Streamlit Dashboard
    location /dashboard/ {
        proxy_pass http://kuera_dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Health check endpoint
    location /nginx-health {
        access_log off;
        return 200 'nginx OK\n';
        add_header Content-Type text/plain;
    }
}
